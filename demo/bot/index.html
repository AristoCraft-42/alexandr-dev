<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<title>Бот записи «Ферзь» — демо</title>
<style>
  :root { --bg:#0e1621; --head:#17212b; --in:#182533; --out:#2b5278; --text:#f5f5f5; --muted:#7f91a4; --btn:#1f2f3f; --accent:#64b5ef; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; display:flex; flex-direction:column; }
  .head { background:var(--head); padding:10px 14px; display:flex; align-items:center; gap:12px; flex:0 0 auto; }
  .ava { width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,#d4a24c,#8a5a1c); display:grid; place-items:center; font-weight:700; color:#141210; }
  .head b { display:block; }
  .head small { color:var(--muted); }
  .demo-note { background:#233040; color:var(--muted); font-size:11.5px; text-align:center; padding:5px; flex:0 0 auto; }
  .chat { flex:1; overflow-y:auto; padding:12px 10px 6px; display:flex; flex-direction:column; gap:6px;
          background: radial-gradient(circle at 20% 20%, #13202e 0, transparent 40%), radial-gradient(circle at 80% 70%, #102030 0, transparent 40%), var(--bg); }
  .msg { max-width:84%; padding:8px 11px 6px; border-radius:14px; white-space:pre-line; animation:pop .18s ease; }
  .msg time { display:block; text-align:right; font-size:11px; color:var(--muted); margin-top:2px; }
  .bot { background:var(--in); align-self:flex-start; border-bottom-left-radius:4px; }
  .me { background:var(--out); align-self:flex-end; border-bottom-right-radius:4px; }
  .me time { color:#9cc1e4; }
  .kb { align-self:flex-start; max-width:84%; display:grid; gap:4px; margin-top:-2px; width:84%; }
  .kb.cols2 { grid-template-columns:1fr 1fr; }
  .kb.cols4 { grid-template-columns:repeat(4, 1fr); }
  .kb button { background:var(--btn); color:var(--text); border:0; border-radius:8px; padding:9px 6px; font:inherit; font-size:14px; cursor:pointer; }
  .kb button:hover { background:#294059; }
  .kb button:disabled { opacity:.35; cursor:default; text-decoration:line-through; }
  .kb.used button { opacity:.5; pointer-events:none; }
  .typing { align-self:flex-start; color:var(--muted); font-size:13px; padding:4px 10px; }
  .input { flex:0 0 auto; background:var(--head); padding:10px 12px; display:flex; gap:8px; align-items:center; }
  .input input { flex:1; background:transparent; border:0; color:var(--text); font:inherit; outline:none; }
  .input button { background:none; border:0; color:var(--accent); font-size:22px; cursor:pointer; }
  .sys { align-self:center; background:rgba(0,0,0,.35); color:#cfd8e2; font-size:12.5px; padding:4px 10px; border-radius:10px; margin:4px 0; text-align:center; max-width:90%; }
  @keyframes pop { from { transform:scale(.96); opacity:0 } to { transform:none; opacity:1 } }
</style>
</head>
<body>
<div class="head"><div class="ava">Ф</div><div><b>Ферзь · запись</b><small>бот</small></div></div>
<div class="demo-note">Демо для портфолио · барбершоп вымышленный, всё работает прямо в браузере</div>
<div class="chat" id="chat"></div>
<form class="input" id="form"><input id="txt" placeholder="Сообщение" autocomplete="off"><button aria-label="Отправить">➤</button></form>

<script>
const SERVICES = [
  ['Стрижка', 1500, 60], ['Фейд', 1800, 60], ['Борода', 900, 30], ['Стрижка + борода', 2200, 90],
];
const MASTERS = ['Артём', 'Денис', 'Руслан', 'Любой'];
const TIMES = ['11:00','12:00','13:00','15:00','16:00','17:00','19:00','20:00'];
const chat = document.getElementById('chat');
const st = {};
const now = () => new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
const rub = n => n.toLocaleString('ru-RU') + ' ₽';
const scroll = () => chat.scrollTop = chat.scrollHeight;

function add(cls, text) {
  const m = document.createElement('div');
  m.className = 'msg ' + cls;
  m.innerHTML = text + `<time>${now()}</time>`;
  chat.appendChild(m); scroll();
}
function sys(text) { const m = document.createElement('div'); m.className = 'sys'; m.textContent = text; chat.appendChild(m); scroll(); }
function kb(buttons, cols, onPick) {
  const k = document.createElement('div');
  k.className = 'kb' + (cols ? ' cols' + cols : '');
  buttons.forEach(([label, val, disabled]) => {
    const b = document.createElement('button');
    b.textContent = label; b.disabled = !!disabled;
    b.onclick = () => { k.classList.add('used'); add('me', label); onPick(val); };
    k.appendChild(b);
  });
  chat.appendChild(k); scroll();
}
function bot(text, then, delay = 550) {
  const t = document.createElement('div'); t.className = 'typing'; t.textContent = 'печатает…';
  chat.appendChild(t); scroll();
  setTimeout(() => { t.remove(); add('bot', text); then && then(); }, delay);
}

function start() {
  bot('Привет! 👋 Я бот барбершопа «Ферзь».\nЗапишу вас к мастеру за полминуты.', () =>
    kb([['✂️ Записаться', 'book'], ['💰 Цены', 'prices'], ['📍 Адрес и часы', 'addr'], ['📋 Мои записи', 'my']], 2, menu));
}
function menu(v) {
  if (v === 'book') return chooseService();
  if (v === 'prices') return bot(SERVICES.map(s => `${s[0]} — ${rub(s[1])}`).join('\n'), back);
  if (v === 'addr') return bot('📍 ул. Садовая, 12, вход со двора\n🕙 Ежедневно 10:00–22:00\n🚇 5 минут от метро', back);
  if (v === 'my') return bot(st.booked ? `У вас запись:\n${st.booked}` : 'У вас пока нет записей.', back);
}
function back() { kb([['✂️ Записаться', 'book'], ['💰 Цены', 'prices'], ['📍 Адрес и часы', 'addr'], ['📋 Мои записи', 'my']], 2, menu); }

function chooseService() {
  bot('Какая услуга?', () => kb(SERVICES.map((s, i) => [`${s[0]} · ${rub(s[1])}`, i]), 0, i => { st.s = SERVICES[i]; chooseMaster(); }));
}
function chooseMaster() {
  bot('К какому мастеру?', () => kb(MASTERS.map(m => [m, m]), 2, m => { st.m = m === 'Любой' ? 'Денис' : m; chooseDay(); }));
}
function chooseDay() {
  const wd = ['вс','пн','вт','ср','чт','пт','сб'];
  const opts = [0, 1, 2, 3].map(i => { const d = new Date(); d.setDate(d.getDate() + i);
    const label = i === 0 ? 'Сегодня' : i === 1 ? 'Завтра' : `${wd[d.getDay()]}, ${d.getDate()}`;
    return [label, label]; });
  bot('Когда удобно?', () => kb(opts, 2, d => { st.d = d; chooseTime(); }));
}
function chooseTime() {
  const seed = st.d.length + st.m.length;
  bot(`Свободное время у мастера ${st.m}:`, () =>
    kb(TIMES.map((t, i) => [t, t, (i * 3 + seed) % 4 === 0]), 4, t => { st.t = t; confirm(); }));
}
function confirm() {
  bot(`Проверьте запись:\n\n✂️ ${st.s[0]} — ${rub(st.s[1])}\n👤 ${st.m}\n📅 ${st.d}, ${st.t}\n\nВсё верно?`, () =>
    kb([['✅ Подтвердить', 'ok'], ['✏️ Изменить', 'edit']], 2, v => v === 'ok' ? done() : chooseService()));
}
function done() {
  st.booked = `${st.s[0]}, ${st.m}, ${st.d.toLowerCase()} в ${st.t}`;
  bot(`Готово, вы записаны! 🎉\n${st.booked}\n\nНапомню накануне вечером. Если планы изменятся, отменить можно здесь же.`, () => {
    sys(`📲 Мастеру ${st.m} пришло уведомление о новой записи`);
    setTimeout(() => {
      sys('⏩ Перематываем на вечер накануне визита…');
      bot(`Напоминаю: завтра в ${st.t} вас ждёт ${st.m} 💈\nВсё в силе?`, () =>
        kb([['👍 Приду', 'yes'], ['🔁 Перенести', 'move'], ['❌ Отменить', 'cancel']], 0, v => {
          if (v === 'yes') bot('Отлично, до встречи!', back);
          else if (v === 'move') chooseDay();
          else { st.booked = null; bot('Запись отменена, окно освободилось для других клиентов.', back); }
        }), 900);
    }, 1400);
  });
}

document.getElementById('form').onsubmit = e => {
  e.preventDefault();
  const v = document.getElementById('txt').value.trim();
  if (!v) return;
  add('me', v.replace(/</g, '&lt;'));
  document.getElementById('txt').value = '';
  bot('Я пока понимаю только кнопки 🙂 Выберите действие:', back);
};
start();
</script>
</body>
</html>
